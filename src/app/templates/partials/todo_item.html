{% set todo_priority = todo.priority or TODO_PRIORITY_LOW %}

<div class="todo-item {% if todo.is_completed %}completed{% endif %} {% if is_overdue(todo) %}overdue{% endif %} {% if is_due_today(todo) %}due-today{% endif %} priority-{{ todo_priority }}"
     id="todo-{{ todo.id }}"
     data-todo-id="{{ todo.id }}"
     data-todo-title="{{ todo.title | e }}"
     data-todo-note="{{ (todo.note or '') | e }}"
     data-todo-due-date="{{ format_date_input(todo.due_date) }}"
     data-todo-priority="{{ todo_priority }}">
    <sl-icon name="grip-vertical" class="todo-drag-handle"></sl-icon>
    <div class="todo-checkbox">
        <sl-checkbox
            {% if todo.is_completed %}checked{% endif %}
            hx-patch="/api/todos/{{ todo.id }}/toggle"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML">
        </sl-checkbox>
    </div>

    <div class="todo-content">
        <span class="todo-title">{{ todo.title }}</span>
        {% if todo.note %}
        <p class="todo-note">{{ todo.note }}</p>
        {% endif %}
        <div class="todo-meta">
            {% if todo.due_date %}
            <span class="todo-due-date {% if is_overdue(todo) %}overdue{% endif %} {% if is_due_today(todo) %}due-today{% endif %}">
                <sl-icon name="calendar3"></sl-icon>
                {{ format_date(todo.due_date) }}
            </span>
            {% endif %}
            <sl-badge variant="{{ 'danger' if todo_priority == TODO_PRIORITY_HIGH else 'warning' if todo_priority == TODO_PRIORITY_MEDIUM else 'success' }}" pill>
                {{ todo_priority | capitalize }}
            </sl-badge>
        </div>
    </div>

    <div class="todo-actions">
        <sl-icon-button name="pencil"
                        label="Edit todo"
                        class="edit-todo-btn"
                        onclick="openEditTodoDialog({{ todo.id | tojson }}, {{ todo.title | tojson }}, {{ (todo.note or '') | tojson }}, {{ format_date_input(todo.due_date) | tojson }}, {{ todo_priority | tojson }})">
        </sl-icon-button>
        <sl-icon-button name="trash"
                        label="Delete todo"
                        class="delete-todo-btn danger-icon"
                        onclick="confirmDeleteTodo({{ todo.id | tojson }}, {{ todo.title | tojson }})">
        </sl-icon-button>
    </div>
</div>
